name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright traces and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore

      - name: Summarize Playwright artifacts
        if: always()
        run: |
          {
            echo "## Playwright Reports"
            echo
            if [ -f test-results/playwright/junit.xml ]; then
              echo "- JUnit report generated at \`test-results/playwright/junit.xml\`."
            else
              echo "- JUnit report was not generated."
            fi
            if [ -d playwright-report ]; then
              echo "- HTML report uploaded as artifact: \`playwright-report\`."
            else
              echo "- HTML report directory was not produced."
            fi
            if [ -d test-results/playwright ]; then
              FILE_COUNT=$(find test-results/playwright -type f | wc -l | tr -d ' ')
              echo "- Raw Playwright results uploaded as artifact: \`playwright-test-results\` (${FILE_COUNT} files)."
            else
              echo "- Raw Playwright results directory was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
